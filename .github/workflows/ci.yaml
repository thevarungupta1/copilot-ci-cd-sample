name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Build Docker image
        run: docker build -t sampleapp:${{ github.sha }} .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag sampleapp:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/sampleapp:${{ github.sha }}
          docker tag sampleapp:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/sampleapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sampleapp:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/sampleapp:latest
